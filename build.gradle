plugins {
	id 'fabric-loom' version '1.13.6'
	// Applying the Kotlin plugin makes Loom remap the Kotlin @Metadata of mod dependencies
	// (Cobblemon) into our mappings. Without this, Cobblemon's Kotlin reflection looks up
	// intermediary names (e.g. net.minecraft.class_2960) that don't exist at dev runtime.
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Isolated integration tests use the real Cobblemon data and packet types; never ship the test mod.
if (project.hasProperty('megaAbilityTests')) {
	apply from: 'tools/mega-ability-tests.gradle'
}

repositories {
	// Cobblemon is published here
	maven {
		name = 'Cobblemon'
		url = 'https://maven.impactdev.net/repository/development/'
	}
	// Architectury is a transitive dependency of Cobblemon
	maven {
		name = 'Architectury'
		url = 'https://maven.architectury.dev/'
	}
	// Mod Menu / Terraformers (optional integrations)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	mavenCentral()
}

// Loom strips Minecraft's client-only ICU from server runs, but Cobblemon's GraalJS needs it.
// Add Cobblemon's own ICU version after that filtering, only to development server launches.
configurations {
	showdownServerIcu {
		canBeConsumed = false
		transitive = false
	}
}

tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	if (name.endsWith('Server')) {
		classpath configurations.showdownServerIcu
	}
}

dependencies {
	showdownServerIcu 'com.ibm.icu:icu4j:71.1'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang mappings — matches the mappings Cobblemon is developed against,
	// so its exposed Minecraft types line up 1:1 with our code (no Yarn translation).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Kotlin runtime required by Cobblemon
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Cobblemon itself (the API we build the Mega Evolution add-on against)
	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

	// Local dev-testing only: load Cobblemon Raid Dens + GeckoLib into runClient/runServer when those
	// jars are present in test-server/mods (not committed). Guarded so CI builds (no test-server) skip
	// it; runtime-only, never shipped. Lets us exercise megacobble against raid (custom) battles in dev.
	def geckoJar = file("test-server/mods/geckolib-fabric-1.21.1-4.8.4.jar")
	def raidJar = file("test-server/mods/cobblemonraiddens-fabric-0.11.1+1.21.1.jar")
	def clothJar = file("test-server/mods/cloth-config-15.0.140-fabric.jar")
	if (geckoJar.exists() && raidJar.exists()) {
		modLocalRuntime files(geckoJar)
		modLocalRuntime files(raidJar)
		// Cloth Config (autoconfig) — transitive runtime dep of Raid Dens' Showdown loader.
		if (clothJar.exists()) modLocalRuntime files(clothJar)
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
