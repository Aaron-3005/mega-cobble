sourceSets {
    abilityTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        megacobble { sourceSet sourceSets.main }
        megacobble_ability_test { sourceSet sourceSets.abilityTest }
    }
    runs {
        abilityTestServer {
            server()
            source sourceSets.abilityTest
            runDir 'build/ability-test-server'
            programArg '--nogui'
        }
    }
}

tasks.register('prepareAbilityTestServer') {
    doLast {
        def dir = file('build/ability-test-server')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-type=minecraft:flat
generate-structures=false
spawn-protection=0
view-distance=2
simulation-distance=2
'''
        new File(dir, 'ability-tests-passed.txt').delete()
    }
}
tasks.named('runAbilityTestServer') {
    dependsOn 'prepareAbilityTestServer'
    doLast {
        if (!file('build/ability-test-server/ability-tests-passed.txt').exists()) {
            throw new GradleException('Mega ability integration tests failed; see the test server log.')
        }
    }
}
