name: Build

on:
  push:
    branches: [cobblemon-1.8]
    tags: ['v*']
  pull_request:
    branches: [cobblemon-1.8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: megacobble-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Fabric JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: bash ./gradlew build --no-daemon --stacktrace --max-workers=2

      - name: Verify simulator mechanics
        run: python3 tools/test_mega_abilities.py

      - name: Verify Minecraft Mega lifecycles
        timeout-minutes: 5
        run: bash ./gradlew -PmegaAbilityTests runAbilityTestServer --no-daemon --stacktrace --max-workers=2

      - name: Verify and collect installable JAR
        run: python3 .github/scripts/prepare-artifact.py

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megacobble-jar
          path: dist/megacobble-*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish downloadable JAR
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/cobblemon-1.8' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: megacobble-jar
          path: dist

      - name: Update rolling latest release
        if: github.ref == 'refs/heads/cobblemon-1.8'
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/megacobble-*.jar)
          [[ ${#jars[@]} -eq 1 ]]
          cp "${jars[0]}" megacobble-latest-cobblemon-1.8.jar
          if gh api "repos/$GH_REPO/git/ref/tags/latest-cobblemon-1.8" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest-cobblemon-1.8" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest-cobblemon-1.8 -f sha="$GITHUB_SHA"
          fi
          printf 'Automatic Fabric build of commit `%s`. Requires Minecraft 1.21.1, Cobblemon 1.8.2, Fabric API and Fabric Language Kotlin.\n' "$GITHUB_SHA" > release-notes.md
          if gh release view latest-cobblemon-1.8 >/dev/null 2>&1; then
            gh release edit latest-cobblemon-1.8 --title 'Latest build (Cobblemon 1.8)' --prerelease --notes-file release-notes.md
            gh release upload latest-cobblemon-1.8 megacobble-latest-cobblemon-1.8.jar --clobber
          else
            gh release create latest-cobblemon-1.8 megacobble-latest-cobblemon-1.8.jar --verify-tag \
              --title 'Latest build (Cobblemon 1.8)' --prerelease --notes-file release-notes.md
          fi
          printf '### Download\n[megacobble-latest-cobblemon-1.8.jar](https://github.com/%s/releases/download/latest-cobblemon-1.8/megacobble-latest-cobblemon-1.8.jar)\n' "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/megacobble-*.jar)
          [[ ${#jars[@]} -eq 1 ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Existing version assets stay immutable; only add a missing asset.
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            if ! grep -Fxq "$(basename "${jars[0]}")" <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" "${jars[0]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${jars[0]}" --verify-tag \
              --title "$GITHUB_REF_NAME (Cobblemon 1.8.2)" --generate-notes --latest=false
          fi
          printf '### Versioned release\n[%s](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REF_NAME" "$GH_REPO" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
